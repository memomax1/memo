<style>
:root{--bg:#080e1c;--card:#101a2c;--line:#263957;--text:#eaf1ff;--muted:#a9b8d3;--accent:#48d6c5}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;line-height:1.7;padding:25px 15px 40px}
.container{max-width:1200px;margin:auto}
header{text-align:center;padding:25px 10px;border-bottom:1px solid var(--line);margin-bottom:30px}
header h1{color:var(--accent);font-size:clamp(24px,5vw,32px);letter-spacing:1px}
header p{color:var(--muted);margin-top:8px}
.frame-box{background:var(--card);border:1px solid var(--line);padding:10px;border-radius:12px;overflow:hidden}
main{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.frame-box:nth-child(5){grid-column:1 / -1}
.frame-box h2{font-size:14px;color:var(--accent);letter-spacing:1.5px;padding:4px 6px 10px}
iframe{width:100%;height:650px;border:none;border-radius:8px;background:#fff;display:block}
.disclosure{color:var(--muted);font-size:13px;text-align:center;margin-top:25px}
.footer{text-align:center;color:#8d9db9;font-size:13px;padding:25px 5px 0;margin-top:30px;border-top:1px solid var(--line)}
@media(max-width:800px){main{grid-template-columns:1fr}.frame-box:nth-child(5){grid-column:auto}}
@media(max-width:600px){iframe{height:550px}}
</style>
</head>
