<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memo Max 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: #111; }

    header {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e2f;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
    }

    .stage {
      position: relative;
      overflow: hidden;
      height: calc(100vh - 50px);
    }

    .grid {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      padding: 4px;
    }

    .frame-box {
      position: relative;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
    }

    .frame-box span {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    iframe { width: 100%; height: 100%; border: 0; }

    /* Light curtain covering all four frames */
    .curtain {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    /* Fog layer extends past the edges so the borders are blurred too */
    .curtain::before {
      content: "";
      position: absolute;
      inset: -60px;
      z-index: -1;
      background:
        radial-gradient(ellipse at 25% 30%, rgba(120, 120, 130, 0.9), transparent 60%),
        radial-gradient(ellipse at 75% 70%, rgba(100, 100, 112, 0.9), transparent 60%),
        rgb(52, 52, 60);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 16px;
      line-height: 28px;
      cursor: pointer;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.3); }

    .secret-x {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: transparent;
      opacity: 0;
      font-size: 20px;
      line-height: 36px;
      cursor: default;
      outline: none;
    }

    .curtain h2 {
      color: #ffffff;
      font-size: clamp(22px, 5vw, 44px);
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    /* ===== Ads section (below the grid) ===== */
    .ads {
      background: #1e1e2f;
      padding: 16px 8px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .ads-label {
      color: #aaa;
      font-size: 12px;
    }
    .ad-slot {
      max-width: 100%;
      overflow-x: auto;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>Memo Max 1</header>

  <div class="stage">
    <div class="grid">
      <div class="frame-box">
        <span>Frame 1</span>
        <iframe src="https://lltrco.com/?r=mahmoudyoussef20" title="Frame 1"></iframe>
      </div>
      <div class="frame-box">
        <span>Frame 2</span>
        <iframe src="https://lltrco.com/?r=mahmoudyoussef2024" title="Frame 2"></iframe>
      </div>
      <div class="frame-box">
        <span>Frame 3</span>
        <iframe src="https://lltrco.com/?r=mmyy11" title="Frame 3"></iframe>
      </div>
      <div class="frame-box">
        <span>Frame 4</span>
        <iframe src="https://lltrco.com/?r=mmyy1" title="Frame 4"></iframe>
      </div>
    </div>

    <div class="curtain" id="curtain">
      <button class="close-btn" aria-label="Close" onclick="document.getElementById('curtain').style.display='none';document.getElementById('curtain2').style.display='flex'">&#10005;</button>
      <h2>Solve the puzzle to find out the secret</h2>
    </div>

    <div class="curtain" id="curtain2" style="display:none">
      <button class="secret-x" aria-label="Solve" onclick="document.getElementById('curtain2').style.display='none'">&#10005;</button>
      <h2>You solved half of the puzzle</h2>
    </div>
  </div>

  <!-- Ads: always visible, below the grid -->
  <section class="ads">
    <div class="ads-label">إعلانات</div>

    <!-- Native banner -->
    <div class="ad-slot">
      <script async="async" data-cfasync="false" src="https://bauval.org/21/fea48d233e3fb5fa729730759dae7207"></script>
      <div id="container-fea48d233e3fb5fa729730759dae7207"></div>
    </div>

    <!-- Banner 320x50 -->
    <div class="ad-slot">
      <script>
        atOptions = {
          'key' : '46f7e3e98a0485b4ad583905fecc3e0e',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script src="https://bauval.org/22/46f7e3e98a0485b4ad583905fecc3e0e"></script>
    </div>

    <!-- Banner 468x60 -->
    <div class="ad-slot">
      <script>
        atOptions = {
          'key' : 'd6900bc920a2da0e411bb54cbba13ede',
          'format' : 'iframe',
          'height' : 60,
          'width' : 468,
          'params' : {}
        };
      </script>
      <script src="https://bauval.org/22/d6900bc920a2da0e411bb54cbba13ede"></script>
    </div>
  </section>

  <!-- Social bar -->
  <script data-cfasync="false" src="https://bauval.org/14/780e7dd050cabc042fe515a71fc4dc9d"></script>
</body>
</html>
