<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الصفحات</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--text:#1b2430;--muted:#5d6b7c;--line:#d5dbe3;--accent:#1f6feb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--text:#e8edf3;--muted:#93a1b3;--line:#2c3643;--accent:#5aa2ff}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--text:#e8edf3;--muted:#93a1b3;--line:#2c3643;--accent:#5aa2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:1400px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.4rem;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1 / -1;margin-top:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.9rem}
.bar span{color:var(--muted);direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar a{color:var(--accent);text-decoration:none;white-space:nowrap}
.bar a:hover,.bar a:focus-visible{text-decoration:underline}
iframe{width:100%;height:480px;border:0;display:block;background:#fff}
.wide iframe{height:560px}
@media (max-width:800px){.grid{grid-template-columns:1fr}iframe{height:420px}}
</style>
</head>
<body>
<main>
  <h1>لوحة الصفحات</h1>
  <div class="grid">
    <section class="card">
      <div class="bar"><span>mahmoudyoussef20</span><a href="https://lltrco.com/?r=mahmoudyoussef20" target="_blank" rel="noopener">فتح في تاب</a></div>
      <iframe title="mahmoudyoussef20" src="https://lltrco.com/?r=mahmoudyoussef20" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
    <section class="card">
      <div class="bar"><span>mmyy1</span><a href="https://lltrco.com/?r=mmyy1" target="_blank" rel="noopener">فتح في تاب</a></div>
      <iframe title="mmyy1" src="https://lltrco.com/?r=mmyy1"></iframe>
    </section>
    <section class="card">
      <div class="bar"><span>mmyy11</span><a href="https://lltrco.com/?r=mmyy11" target="_blank" rel="noopener">فتح في تاب</a></div>
      <iframe title="mmyy11" src="https://lltrco.com/?r=mmyy11"></iframe>
    </section>
    <section class="card">
      <div class="bar"><span>mahmoudyoussef2024</span><a href="https://lltrco.com/?r=mahmoudyoussef2024" target="_blank" rel="noopener">فتح في تاب</a></div>
      <iframe title="mahmoudyoussef2024" src="https://lltrco.com/?r=mahmoudyoussef2024"></iframe>
    </section>
    <section class="card wide">
      <div class="bar"><span>mmyy2</span><a href="https://lltrco.com/?r=mmyy2" target="_blank" rel="noopener">فتح في تاب</a></div>
      <iframe title="mmyy2" src="https://lltrco.com/?r=mmyy2"></iframe>
    </section>
  </div>
</main>
</body>
</html>
